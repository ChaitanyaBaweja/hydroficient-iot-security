<title>How the AI Learns Normal</title>
<script>
(function () {
// Deterministic PRNG. Verified to produce a byte-identical stream to
// tools/reference.py, which is what makes golden-vector testing possible.
function mulberry32(a) {
  return function () {
    a |= 0;
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

class Rng {
  constructor(seed = 1337) {
    this.next = mulberry32(seed);
    this._spare = null;
  }
  uniform(lo, hi) {
    return lo + this.next() * (hi - lo);
  }
  // Box-Muller. The spare value is cached so the draw order stays deterministic.
  normal(mu = 0, sigma = 1) {
    if (this._spare !== null) {
      const s = this._spare;
      this._spare = null;
      return mu + sigma * s;
    }
    let u = 0, v = 0;
    while (u === 0) u = this.next();
    while (v === 0) v = this.next();
    const mag = Math.sqrt(-2 * Math.log(u));
    this._spare = mag * Math.sin(2 * Math.PI * v);
    return mu + sigma * mag * Math.cos(2 * Math.PI * v);
  }
}

const api = { mulberry32, Rng };
if (typeof module !== 'undefined' && module.exports) module.exports = api;
if (typeof window !== 'undefined') window.Demo = Object.assign(window.Demo || {}, api);

})();
</script>
<script>
(function () {
// Simulation model for the Grand Marina demo.
// Every constant here is fixed by docs/plans/2026-08-23-tech-demo-design.md.
const P = {
  MU0: 60.0, SIGMA: 1.0, P_LO: 58.0, P_HI: 62.0,
  F_BASE: 50.0, F_SLOPE: 2.5, F_NOISE: 1.5, F_LO: 45.0, F_HI: 55.0,
  GATE0: 45.0, GATE_MIN: 5.0, GATE_MAX: 100.0,
  KP: 0.9, WINDOW: 10, DEADBAND: 0.8, RESTORE: 0.02,
  ATTACK_LO: 60.5, ATTACK_HI: 61.9,
  CRUDE_PRESSURE: 85.0, CRUDE_FLOW: 50.0,
  SPRINKLER_MIN: 20.0, FLOORS: 12,
};

const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

const normalPressure = (rng) => clamp(rng.normal(P.MU0, P.SIGMA), P.P_LO, P.P_HI);
const attackPressure = (rng) => rng.uniform(P.ATTACK_LO, P.ATTACK_HI);

// Flow is correlated with the *reported* pressure, which is what makes the
// Artifact 1 scatter plot a tilted ellipse rather than a round cloud.
const reportedFlow = (rng, pressure) =>
  clamp(P.F_BASE + P.F_SLOPE * (pressure - P.MU0) + rng.normal(0, P.F_NOISE), P.F_LO, P.F_HI);

// Cloud-side conservation controller. Both the drive and the restoring term are
// required: a pure integrator random-walks the gate out of band on a normal day.
function controllerStep(gate, window) {
  let e = window.reduce((s, x) => s + x, 0) / window.length - P.MU0;
  if (Math.abs(e) < P.DEADBAND) e = 0;
  return clamp(gate - P.KP * e + P.RESTORE * (P.GATE0 - gate), P.GATE_MIN, P.GATE_MAX);
}

// Linearised hydraulics — a demo simplification, not engineering.
const residual = (gate) => gate * 1.0;
const trueFlow = (gate) => P.F_BASE * (gate / P.GATE0);
const darkFloors = (res) => clamp(P.FLOORS - Math.floor(res / 2), 0, P.FLOORS);

const api = { P, clamp, normalPressure, attackPressure, reportedFlow,
              controllerStep, residual, trueFlow, darkFloors };
if (typeof module !== 'undefined' && module.exports) module.exports = api;
if (typeof window !== 'undefined') window.Demo = Object.assign(window.Demo || {}, api);

})();
</script>
<script>
(function () {
// Isolation Forest, implemented directly so Artifact 1 can animate real cuts
// rather than replay a canned animation.
//
// The idea in one sentence: slice the plane with random axis-aligned cuts and count
// how many it takes to strand a point alone. Outliers strand fast.

// Expected path length of an unsuccessful BST search over n points — the
// normalisation that turns a raw depth into a comparable score.
function cNorm(n) {
  if (n <= 1) return 0;
  return 2 * (Math.log(n - 1) + 0.5772156649) - (2 * (n - 1)) / n;
}

function buildTree(points, depth, maxDepth, rng) {
  if (depth >= maxDepth || points.length <= 1) {
    return { leaf: true, size: points.length, depth };
  }
  const dim = Math.floor(rng.next() * points[0].length);
  let lo = Infinity, hi = -Infinity;
  for (const p of points) { lo = Math.min(lo, p[dim]); hi = Math.max(hi, p[dim]); }
  if (lo === hi) return { leaf: true, size: points.length, depth };

  const split = rng.uniform(lo, hi);
  const left = [], right = [];
  for (const p of points) (p[dim] < split ? left : right).push(p);
  return {
    leaf: false, dim, split,
    left: buildTree(left, depth + 1, maxDepth, rng),
    right: buildTree(right, depth + 1, maxDepth, rng),
  };
}

function pathLengthFor(point, node, depth = 0) {
  if (node.leaf) return depth + cNorm(node.size);
  return point[node.dim] < node.split
    ? pathLengthFor(point, node.left, depth + 1)
    : pathLengthFor(point, node.right, depth + 1);
}

class IsolationForest {
  constructor({ trees = 100, sampleSize = 256, seed = 1337 } = {}) {
    Object.assign(this, { trees, sampleSize, seed, forest: [] });
  }

  fit(data) {
    const { Rng } = (typeof require !== 'undefined')
      ? require('./prng.js') : window.Demo;
    const rng = new Rng(this.seed);
    const n = Math.min(this.sampleSize, data.length);
    const maxDepth = Math.ceil(Math.log2(Math.max(2, n)));
    this.norm = cNorm(n);
    this.forest = [];
    for (let t = 0; t < this.trees; t++) {
      const sample = [];
      for (let i = 0; i < n; i++) sample.push(data[Math.floor(rng.next() * data.length)]);
      this.forest.push(buildTree(sample, 0, maxDepth, rng));
    }
    return this;
  }

  avgPathLength(point) {
    let total = 0;
    for (const tree of this.forest) total += pathLengthFor(point, tree);
    return total / this.forest.length;
  }

  // Higher score = more anomalous. Range (0, 1).
  score(point) {
    return Math.pow(2, -this.avgPathLength(point) / this.norm);
  }

  // Threshold at the given quantile of the training data's own scores.
  percentileThreshold(data, q = 0.99) {
    const scores = data.map((p) => this.score(p)).sort((a, b) => a - b);
    return scores[Math.min(scores.length - 1, Math.floor(q * scores.length))];
  }

  // Decision surface for rendering the fence in Artifacts 1 and 2.
  grid(xRange, yRange, steps = 60) {
    const out = [];
    for (let i = 0; i < steps; i++) {
      const row = [];
      const x = xRange[0] + ((xRange[1] - xRange[0]) * i) / (steps - 1);
      for (let j = 0; j < steps; j++) {
        const y = yRange[0] + ((yRange[1] - yRange[0]) * j) / (steps - 1);
        row.push(this.score([x, y]));
      }
      out.push(row);
    }
    return out;
  }
}

const api = { IsolationForest, pathLengthFor, cNorm, buildTree };
if (typeof module !== 'undefined' && module.exports) module.exports = api;
if (typeof window !== 'undefined') window.Demo = Object.assign(window.Demo || {}, api);

})();
</script>
<script>
(function () {
// Shared canvas drawing helpers. Deliberately minimal — no chart library, because
// the page must be self-contained and CSP forbids external scripts.
const PALETTE = {
  bg: '#0d1117', grid: '#21262d', text: '#c9d1d9', muted: '#6e7681',
  normal: '#3fb950', warn: '#d29922', danger: '#f85149', accent: '#58a6ff',
};

function scaler(domain, range) {
  const [d0, d1] = domain, [r0, r1] = range;
  return (v) => r0 + ((v - d0) / (d1 - d0)) * (r1 - r0);
}

function axes(ctx, box, xDomain, yDomain, xLabel, yLabel) {
  const { x, y, w, h } = box;
  ctx.strokeStyle = PALETTE.grid; ctx.fillStyle = PALETTE.muted;
  ctx.lineWidth = 1; ctx.font = '12px system-ui, sans-serif';
  ctx.strokeRect(x, y, w, h);
  ctx.fillText(xLabel, x + w / 2 - 30, y + h + 32);
  ctx.save(); ctx.translate(x - 40, y + h / 2); ctx.rotate(-Math.PI / 2);
  ctx.fillText(yLabel, -20, 0); ctx.restore();
}

function scatter(ctx, box, pts, xDomain, yDomain, colour, radius = 1.6) {
  const sx = scaler(xDomain, [box.x, box.x + box.w]);
  const sy = scaler(yDomain, [box.y + box.h, box.y]);
  ctx.fillStyle = colour;
  for (const [px, py] of pts) {
    ctx.beginPath(); ctx.arc(sx(px), sy(py), radius, 0, Math.PI * 2); ctx.fill();
  }
}

function polyline(ctx, box, series, xDomain, yDomain, colour, width = 2) {
  const sx = scaler(xDomain, [box.x, box.x + box.w]);
  const sy = scaler(yDomain, [box.y + box.h, box.y]);
  ctx.strokeStyle = colour; ctx.lineWidth = width; ctx.beginPath();
  series.forEach(([px, py], i) => (i ? ctx.lineTo(sx(px), sy(py)) : ctx.moveTo(sx(px), sy(py))));
  ctx.stroke();
}

const api = { PALETTE, scaler, axes, scatter, polyline };
if (typeof module !== 'undefined' && module.exports) module.exports = api;
if (typeof window !== 'undefined') window.Demo = Object.assign(window.Demo || {}, api);

})();
</script>
